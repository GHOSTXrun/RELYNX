name: Frontend validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Data normalization and fallback tests
        run: node --test tests/solana.test.mjs tests/market.test.mjs
      - name: Verify live public data providers and CORS
        run: node tests/provider-probe.mjs
      - name: Production build
        run: npm run build
      - name: Start production preview and headless browser
        run: |
          npm run preview -- --host 127.0.0.1 > "$RUNNER_TEMP/relynx-preview.log" 2>&1 &
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --enable-unsafe-swiftshader --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/relynx-chrome" about:blank > "$RUNNER_TEMP/relynx-chrome.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json > /dev/null && curl -fsS http://127.0.0.1:4173 > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Browser interaction and responsive checks
        env:
          CHROME_DEBUG_URL: http://127.0.0.1:9222
          RELYNX_PREVIEW_URL: http://127.0.0.1:4173
        run: node tests/model-browser.cjs
