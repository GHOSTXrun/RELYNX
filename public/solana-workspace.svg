<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-labelledby="title desc"><title id="title">RELYNX on Solana</title><desc id="desc">A wallet connects to RELYNX, which reads SOL, SPL assets and transaction records from Solana.</desc><defs><linearGradient id="accent"><stop stop-color="#00d9e8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#182735"/><stop offset="1" stop-color="#101922"/></linearGradient><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#304353"/></pattern></defs><rect width="640" height="280" rx="12" fill="#0e161e"/><rect x="14" y="14" width="612" height="252" rx="8" fill="url(#grid)" opacity=".6"/><g fill="none" stroke="url(#accent)" stroke-width="1.5"><path d="M160 140H245M395 140H475M475 140V69H510M475 140H510M475 140V211H510"/></g><g fill="#00d9e8"><circle cx="200" cy="140" r="3"/><circle cx="437" cy="140" r="3"/><circle cx="475" cy="140" r="3"/></g><g font-family="Arial,Helvetica,sans-serif"><rect x="30" y="99" width="130" height="82" rx="8" fill="url(#panel)" stroke="#324d60"/><rect x="48" y="117" width="27" height="21" rx="4" fill="none" stroke="#8daaba" stroke-width="1.5"/><path d="M67 123h12v11H67z" fill="#1b3442" stroke="#8daaba"/><circle cx="72" cy="128" r="1.5" fill="#00d9e8"/><text x="48" y="159" fill="#dbeaf2" font-size="13">Your wallet</text><rect x="245" y="77" width="150" height="126" rx="10" fill="#142c38" stroke="url(#accent)"/><path d="M269 105h16l9 9-9 9h-16m0 13h25" fill="none" stroke="#00d9e8" stroke-width="3"/><text x="268" y="158" fill="#edf9ff" font-size="20" font-weight="700">RELYNX</text><text x="268" y="181" fill="#86aaba" font-size="10" letter-spacing="1">SOLANA WORKSPACE</text><g fill="#121e29" stroke="#304859"><rect x="510" y="44" width="106" height="50" rx="6"/><rect x="510" y="115" width="106" height="50" rx="6"/><rect x="510" y="186" width="106" height="50" rx="6"/></g><text x="527" y="65" fill="#00d9e8" font-size="12" font-weight="700">SOL</text><text x="527" y="82" fill="#88a3b3" font-size="10">Native balance</text><text x="527" y="136" fill="#a99af8" font-size="12" font-weight="700">SPL</text><text x="527" y="153" fill="#88a3b3" font-size="10">Token accounts</text><text x="527" y="207" fill="#d4e2ec" font-size="12" font-weight="700">Records</text><text x="527" y="224" fill="#88a3b3" font-size="10">Transactions</text><text x="30" y="34" fill="#728f9f" font-size="9" letter-spacing="1.8">ONE CONNECTION / THREE VIEWS</text><text x="30" y="252" fill="#5e7f91" font-size="9">Your wallet stays in control.</text></g></svg>
