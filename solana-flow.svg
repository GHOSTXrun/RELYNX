<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc"><title id="title">The SOL workspace workflow</title><desc id="desc">Connect your wallet, read SOL and SPL balances, prepare a local token draft and review the onchain record in Solana Explorer.</desc><defs><linearGradient id="line"><stop stop-color="#00d9e8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="640" height="240" rx="8" fill="#101922"/><g fill="none" stroke="url(#line)" stroke-width="2"><path d="M160 114H200M320 114H360M480 114H520"/><path d="m190 110 10 4-10 4m160-8 10 4-10 4m160-8 10 4-10 4"/></g><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="30" fill="#8fa9ba" font-size="10" letter-spacing="1.5">FROM CONNECTION TO CLARITY</text><g fill="#172632" stroke="#314b5e"><rect x="24" y="67" width="136" height="102" rx="7"/><rect x="184" y="67" width="136" height="102" rx="7"/><rect x="344" y="67" width="136" height="102" rx="7"/><rect x="504" y="67" width="112" height="102" rx="7"/></g><g fill="#00d9e8" font-size="10"><text x="40" y="91">01 / ACCESS</text><text x="200" y="91">02 / DATA</text><text x="360" y="91">03 / DRAFT</text><text x="520" y="91">04 / CHECK</text></g><g fill="#e0edf5" font-size="16" font-weight="600"><text x="40" y="121">Connect</text><text x="200" y="121">Read</text><text x="360" y="121">Prepare</text><text x="520" y="121">Review</text></g><g fill="#8ba6b7" font-size="10"><text x="40" y="146">Phantom / Solflare</text><text x="200" y="146">SOL + SPL balances</text><text x="360" y="146">Saved on your device</text><text x="520" y="146">Explorer</text></g><path d="M24 195H616" stroke="#263c4c"/><text x="24" y="217" fill="#718fa2" font-size="10">Read-only wallet inspection. Drafts do not create a mint or spend SOL.</text></g></svg>
